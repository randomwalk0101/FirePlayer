name: Build FirePlayer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-native:
    name: macOS native app (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Build native macOS app
        run: |
          chmod +x build.command
          CI=true FIREPLAYER_TARGET_ARCH=${{ matrix.arch }} ./build.command
      - name: Archive native macOS app
        run: ditto -c -k --sequesterRsrc --keepParent FirePlayer.app FirePlayer-native-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FirePlayer-native-macOS-${{ matrix.arch }}
          path: FirePlayer-native-macOS-${{ matrix.arch }}.zip

  windows:
    name: Windows x64 Electron app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: FirePlayer-Windows-x64
          path: |
            cross-platform/dist/*.exe
            cross-platform/dist/*.blockmap

  ubuntu:
    name: Ubuntu x64 Electron app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - run: npm ci
      - run: npm run build:linux
      - uses: actions/upload-artifact@v4
        with:
          name: FirePlayer-Ubuntu-x64
          path: |
            cross-platform/dist/*.AppImage
            cross-platform/dist/*.deb

  android:
    name: Android touch APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FirePlayer-Android-touch-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
