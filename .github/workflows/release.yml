name: Release FirePlayer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-native:
    name: macOS native app (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Build native macOS app
        run: |
          chmod +x build.command
          CI=true FIREPLAYER_TARGET_ARCH=${{ matrix.arch }} ./build.command
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent FirePlayer.app FirePlayer-${{ github.ref_name }}-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-native-${{ matrix.arch }}
          path: FirePlayer-${{ github.ref_name }}-macOS-${{ matrix.arch }}.zip

  windows:
    name: Windows x64 app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - run: npm ci
      - run: npm run build:win
      - name: Rename Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist/FirePlayer Setup 1.8.3.exe" "release/FirePlayer-${{ github.ref_name }}-Windows-x64-Setup.exe"
          Copy-Item "dist/FirePlayer 1.8.3.exe" "release/FirePlayer-${{ github.ref_name }}-Windows-x64-Portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: cross-platform/release/*.exe

  ubuntu:
    name: Ubuntu x64 app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - run: npm ci
      - run: npm run build:linux
      - name: Rename Ubuntu assets
        run: |
          mkdir -p release
          cp dist/FirePlayer-1.8.3.AppImage release/FirePlayer-${{ github.ref_name }}-Ubuntu-x64.AppImage
          cp dist/fireplayer-cross-platform_1.8.3_amd64.deb release/FirePlayer-${{ github.ref_name }}-Ubuntu-x64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-x64
          path: cross-platform/release/*

  android:
    name: Android touch APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle :app:assembleDebug
      - name: Rename Android APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/FirePlayer-${{ github.ref_name }}-Android-touch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-touch
          path: android/release/*.apk

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [macos-native, windows, ubuntu, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: FirePlayer ${{ github.ref_name }}
          files: release-assets/*
          body: |
            FirePlayer ${{ github.ref_name }}

            Downloads:
            - macOS Apple Silicon: `FirePlayer-${{ github.ref_name }}-macOS-arm64.zip`
            - macOS Intel: `FirePlayer-${{ github.ref_name }}-macOS-x86_64.zip`
            - Windows x64 installer: `FirePlayer-${{ github.ref_name }}-Windows-x64-Setup.exe`
            - Windows x64 portable: `FirePlayer-${{ github.ref_name }}-Windows-x64-Portable.exe`
            - Ubuntu x64 AppImage: `FirePlayer-${{ github.ref_name }}-Ubuntu-x64.AppImage`
            - Ubuntu x64 deb: `FirePlayer-${{ github.ref_name }}-Ubuntu-x64.deb`
            - Android touch APK: `FirePlayer-${{ github.ref_name }}-Android-touch.apk`

            Highlights:
            - macOS playlist multi-select and right-click deletion.
            - Click subtitle area to play/pause.
            - Double-click subtitle area to enter/exit full screen.
            - Windows/Ubuntu playlist double-click playback is fixed.
            - Windows/Ubuntu single-line subtitles are centered.
            - Windows/Ubuntu full screen now hides the playlist, controls, and app menu.
            - Windows/Ubuntu full-screen subtitle sizing is constrained to avoid distorted layouts.
            - Windows/Ubuntu playlist width can be adjusted by dragging the divider.
            - Ubuntu/Linux packages launch with `--no-sandbox` by default to avoid Electron sandbox startup failures.
            - New Electron-based Windows and Ubuntu/Linux version.
            - Subtitle font size controls are implemented for Windows and Ubuntu/Linux.
            - New touch-first Android APK for phones, tablets, and ordinary Android head units.
